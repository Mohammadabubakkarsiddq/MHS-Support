<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 34C11 31 4 23 4 9c8 0 13 5 16 13 3-8 8-13 16-13 0 14-7 22-16 25z" fill="#7b3fc4"/><path d="M20 34c-4-6-5-14-2.5-21 1.4 2.2 2.1 5 2.5 8 .4-3 1.1-5.8 2.5-8C25 20 24 28 20 34z" fill="#c3a2ec"/></svg>
      <div><strong>Management Support</strong><span>Admin panel</span></div>
    </div>
    <nav class="nav" aria-label="Main">
      <a class="nav-item current" href="home.html"><svg class="ico" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span><span data-username></span> Dashboard</span></a>
      <a class="nav-sub current" href="home.html">Dashboard</a>
      <a class="nav-item" href="add-task.html"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 13l2 2 4-4"/></svg><span>Task</span></a>
      <a class="nav-sub" href="add-task.html">Add Task</a>
      <a class="nav-sub" href="view-tasks.html">View &amp; Edit Task</a>
    </nav>
    <button type="button" class="nav-item logout" id="logoutBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M15 12H4"/><path d="M8 8l-4 4 4 4"/><path d="M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg><span>Log out</span></button>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1>MY HEALTH SCHOOL</h1>
      <div class="range">
        <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <input type="date" id="fromDate" aria-label="From date" />
        <span>–</span>
        <input type="date" id="toDate" aria-label="To date" />
        <button type="button" class="range-clear" id="rangeReset" title="Reset to this month" aria-label="Reset to this month">×</button>
      </div>
      <div class="avatar" id="avatar">?</div>
    </header>

    <main class="content">
      <div class="section-head">
        <h2><span data-username></span> Dashboard</h2>
        <span class="sync" id="syncText"></span>
        <button type="button" class="icon-btn" id="refreshBtn" title="Reload from sheet" aria-label="Reload from sheet"><svg class="ico" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      </div>

      <section class="stat-grid" id="statGrid"></section>

      <section class="chart-grid">
        <div class="panel">
          <h3>Status split</h3>
          <div class="chart-box"><canvas id="statusChart"></canvas><div class="chart-empty" id="statusEmpty" hidden>No tasks in this range</div></div>
        </div>
        <div class="panel">
          <h3>Tasks by start date</h3>
          <div class="chart-box"><canvas id="dailyChart"></canvas></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h3>Tasks in this range</h3>
          <a class="link" href="view-tasks.html">View &amp; edit tasks</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>ID</th><th>Task</th><th>Category</th><th>Priority</th><th>Status</th><th>Start</th><th>Due</th></tr>
            </thead>
            <tbody id="taskRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="popup-backdrop" id="popup">
  <div class="popup" id="popupBox" role="alertdialog" aria-live="assertive">
    <p id="popupText"></p>
    <button type="button" id="popupClose">OK</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="script.js"></script>
  <script src="popup.js"></script>
<script src="shell.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
