<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assign Task</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css?v=2" />
</head>
<body data-admin-page>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 34C11 31 4 23 4 9c8 0 13 5 16 13 3-8 8-13 16-13 0 14-7 22-16 25z" fill="#7b3fc4"/><path d="M20 34c-4-6-5-14-2.5-21 1.4 2.2 2.1 5 2.5 8 .4-3 1.1-5.8 2.5-8C25 20 24 28 20 34z" fill="#c3a2ec"/></svg>
      <div><strong>Management Support</strong><span data-role-label>Admin panel</span></div>
    </div>
    <nav class="nav" aria-label="Main">
      <a class="nav-item" href="home.html"><svg class="ico" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span><span data-username></span> Dashboard</span></a>
      <a class="nav-sub" href="home.html">Dashboard</a>
      <a class="nav-item current" href="add-task.html"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 13l2 2 4-4"/></svg><span>Task</span></a>
      <a class="nav-sub" href="add-task.html">Add Task</a>
      <a class="nav-sub" href="view-tasks.html">View &amp; Edit Task</a>
      <a class="nav-sub current" data-admin href="assign-task.html">Assign Task</a>
      <a class="nav-sub" data-admin href="assigned-tasks.html">View &amp; Edit Assigned Task</a>
      <a class="nav-sub" href="add-reminder.html">Add Reminder</a>
      <a class="nav-sub" href="reminders.html">View Reminders</a>
      <a class="nav-item" href="calendar.html"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h3M8 17h6"/></svg><span>Calendar</span></a>
      <a class="nav-sub" href="calendar.html">My Calendar</a>
    </nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1>MY HEALTH SCHOOL</h1>
      <div class="profile" id="profile">
        <button type="button" class="avatar avatar-btn" id="avatar" aria-haspopup="true" aria-expanded="false" aria-controls="profileMenu">?</button>
        <div class="profile-menu" id="profileMenu" role="menu">
          <div class="pm-head">
            <div class="pm-avatar" id="pmAvatar">?</div>
            <div><strong id="pmName"></strong><span class="chip" id="pmRole"></span></div>
          </div>
          <dl class="pm-details">
            <dt>Mail ID</dt><dd id="pmEmail">–</dd>
            <dt>Mobile</dt><dd id="pmNumber">–</dd>
          </dl>
          <button type="button" class="pm-logout" id="menuLogout" role="menuitem">
            <svg class="ico" viewBox="0 0 24 24"><path d="M15 12H4"/><path d="M8 8l-4 4 4 4"/><path d="M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg>
            Log out
          </button>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="section-head">
        <h2>Assign Task</h2>
        <a class="link" href="assigned-tasks.html">View assigned tasks</a>
      </div>
      <section class="panel add-panel">
        <div class="panel-head"><h3>New task for an employee</h3></div>
        <form id="assignForm" novalidate>
          <div class="field">
            <label for="assignee">Assign to <span class="req">*</span></label>
            <select id="assignee" name="assignee"></select>
          </div>
          <div class="form-fields"></div>
          <div class="form-actions">
            <button type="submit" class="btn-primary" id="assignBtn">Assign task</button>
            <button type="button" class="btn-ghost" id="clearBtn">Clear form</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>

<div class="popup-backdrop" id="popup">
  <div class="popup" id="popupBox" role="alertdialog" aria-live="assertive">
    <p id="popupText"></p>
    <button type="button" id="popupClose">OK</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="api.js?v=2"></script>
<script src="script.js?v=2"></script>
<script src="popup.js?v=2"></script>
<script src="shell.js?v=2"></script>
<script src="task-form.js?v=2"></script>
<script src="assign-task.js?v=2"></script>
</body>
</html>
