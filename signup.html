<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Create account</h1>
    <p class="subtitle">Fill in your details to sign up.</p>

    <form id="signupForm" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" autocomplete="name" />
      </div>
      <div class="field">
        <label for="number">Mobile number</label>
        <input type="tel" id="number" placeholder="10-digit number" maxlength="10" autocomplete="tel" />
      </div>
      <div class="field">
        <label for="email">Mail ID</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="newPassword">Create password</label>
        <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password" />
        <p class="hint">Must be at least 8 characters.</p>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Type it again" autocomplete="new-password" />
      </div>
      <button type="submit" class="primary" id="signupBtn">Sign up</button>
    </form>

    <p class="switch">Already have an account? <a href="index.html">Log in</a></p>
  </main>

  <div class="popup-backdrop" id="popup">
    <div class="popup" id="popupBox">
      <p id="popupText"></p>
      <button type="button" id="popupClose">OK</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="popup.js"></script>
</body>
</html>
